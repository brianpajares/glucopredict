.btn:hover{background:var(--primary-hover)}.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.grid3{display:grid;gap:16px;margin:26px 0}.mini{padding:18px;border:1px solid var(--border);border-radius:14px;background:var(--subtle)}
.form-shell{max-width:var(--form);margin:36px auto 60px}.progress-label{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:.9rem;margin-bottom:8px}
progress{appearance:none;width:100%;height:8px;border:none;border-radius:99px;overflow:hidden;background:var(--locked);margin-bottom:28px}progress::-webkit-progress-bar{background:var(--locked)}progress::-webkit-progress-value{background:var(--primary)}progress::-moz-progress-bar{background:var(--primary)}
.help{color:var(--muted);margin:.2rem 0 20px}.field{display:grid;gap:8px;margin:20px 0}.field input,.field select{width:100%;min-height:54px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:12px 14px;font-size:1.08rem}
.unitbox{position:relative}.unitbox input{padding-right:64px}.unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.choices{display:grid;gap:10px;margin:20px 0}.choice{position:relative}.choice input{position:absolute;opacity:.0001}.choice label{display:flex;gap:12px;align-items:center;min-height:56px;padding:14px;border:1px solid var(--border);border-radius:12px;cursor:pointer;background:var(--surface)}
.choice input:checked+label{border:2px solid var(--primary);background:color-mix(in srgb,var(--primary) 7%,var(--surface))}.choice input:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto}.choice input:checked+label .dot{border:5px solid var(--primary)}
.actions{display:flex;gap:12px;align-items:center;margin-top:22px}.actions .btn{flex:1}.linkbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;min-height:44px;cursor:pointer}
.error{display:none;background:var(--danger-bg);color:var(--danger-text);padding:10px 12px;border-radius:10px;margin-top:10px}.error.show{display:block}
.process{text-align:center;max-width:600px;margin:100px auto}.loader{width:58px;height:58px;border:6px solid var(--locked);border-top-color:var(--primary);border-radius:50%;margin:0 auto 24px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition:none!important}}
.result-shell{max-width:880px;margin:34px auto 70px}.score-row{display:grid;gap:18px}.score-num{font-size:4rem;font-weight:850;letter-spacing:-.05em;line-height:1}.muted{color:var(--muted)}
.scorebar{position:relative;height:22px;background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 18%,var(--surface)) 0 27%,color-mix(in srgb,var(--primary) 30%,var(--surface)) 27% 46%,color-mix(in srgb,var(--primary) 45%,var(--surface)) 46% 58%,color-mix(in srgb,var(--primary) 60%,var(--surface)) 58% 81%,color-mix(in srgb,var(--primary) 75%,var(--surface)) 81% 100%);border-radius:99px;border:1px solid var(--border);margin:18px 0 8px}.marker{position:absolute;top:-7px;width:4px;height:34px;background:var(--text);transform:translateX(-2px)}.marker::after{content:"";position:absolute;top:-5px;left:-4px;width:12px;height:12px;border-radius:50%;background:var(--text)}
.notice{padding:14px 16px;border-radius:12px;margin:16px 0}.notice.ok{background:var(--success-bg);color:var(--success-text)}.notice.warn{background:var(--warning-bg);color:var(--warning-text)}
.locked-grid{display:grid;gap:12px;margin-top:20px}.locked-card{padding:18px;border:1px solid var(--border);border-radius:14px;background:var(--subtle);position:relative;overflow:hidden}.fake{height:9px;background:var(--locked);border-radius:9px;margin:9px 0}.fake.short{width:58%}.lock{font-size:.82rem;font-weight:800;color:var(--muted)}
.gate{max-width:560px;margin:50px auto}.check{display:flex;gap:10px;align-items:flex-start}.check input{margin-top:5px;width:18px;height:18px}.privacy{font-size:.88rem;color:var(--muted)}
.report{max-width:880px;margin:30px auto 70px}.section{margin:18px 0}.bars{display:grid;gap:10px}.barrow{display:grid;grid-template-columns:130px 1fr 35px;gap:10px;align-items:center}.track{height:12px;background:var(--locked);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--primary);border-radius:99px}
.scenarios{display:grid;gap:10px}.scenario{display:flex;justify-content:space-between;gap:16px;padding:12px;border:1px solid var(--border);border-radius:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.footer{border-top:1px solid var(--border);padding:28px 0;color:var(--muted);font-size:.9rem}.footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.safety{font-size:.88rem;border-left:3px solid var(--primary);padding-left:12px;color:var(--muted);margin:18px 0}
@media(min-width:768px){.grid3{grid-template-columns:repeat(3,1fr)}.locked-grid{grid-template-columns:repeat(3,1fr)}.score-row{grid-template-columns:180px 1fr;align-items:center}.hero{padding-top:88px}}

<body>
<div class="wrap topbar">
  <div class="brand"><span class="mark" aria-hidden="true">G</span><span>GlucoPredict</span></div>
  <div class="lang" aria-label="Language">
    <button data-lang="es" aria-pressed="true">ES</button><button data-lang="en" aria-pressed="false">EN</button><button data-lang="pt" aria-pressed="false">PT</button>
  </div>
</div>
<main class="wrap" id="app">
<section class="screen active" id="landing">
 <div class="hero">
  <div>
   <div class="eyebrow" data-t="landing.eyebrow"></div>
   <h1 data-t="landing.headline"></h1>
   <p class="lead" data-t="landing.body"></p>
   <div class="trust"><span class="pill">FINDRISC / LA-FINDRISC</span><span class="pill" data-t="landing.trust"></span><span class="pill">Motor 2.0 · QA 2026-10-03</span></div>
   <button class="btn" id="start" data-t="landing.cta"></button>
   <p class="safety" data-t="safety.short"></p>
  </div>
  <div class="grid3" aria-label="Cómo funciona">
   <div class="mini"><strong>01</strong><h3 data-t="how.one_title"></h3><p class="muted" data-t="how.one_body"></p></div>
   <div class="mini"><strong>02</strong><h3 data-t="how.two_title"></h3><p class="muted" data-t="how.two_body"></p></div>
   <div class="mini"><strong>03</strong><h3 data-t="how.three_title"></h3><p class="muted" data-t="how.three_body"></p></div>
  </div>
 </div>
</section>

<section class="screen form-shell" id="wizard" aria-live="polite">
 <div class="progress-label"><span id="progressText"></span><span id="questionKey"></span></div>
 <progress id="progress" max="10" value="1"></progress>
 <div class="card">
  <h2 id="qTitle"></h2><p class="help" id="qHelp"></p>
  <form id="qForm" novalidate></form>
  <div class="error" id="qError" role="alert"></div>
  <div class="actions"><button class="linkbtn" id="back" type="button" data-t="common.back"></button><button class="btn" id="next" type="button" data-t="common.continue"></button></div>
 </div>
</section>

<section class="screen" id="processing">
 <div class="process" aria-live="polite">
  <div class="loader" aria-hidden="true"></div><h2 data-t="common.loading"></h2><p class="muted" data-t="common.loading_sub"></p>
 </div>
</section>

<section class="screen result-shell" id="preview">
 <div class="card">
  <div class="eyebrow" id="evidenceTag"></div>
  <div class="score-row">
   <div><div class="score-num"><span id="scoreVal">—</span><span style="font-size:1.1rem">/26</span></div><div class="muted" id="bandVal"></div></div>
   <div><h2 id="previewTitle"></h2><p id="followupText"></p></div>
  </div>
  <div class="scorebar" aria-label="Score 0 to 26"><div class="marker" id="marker"></div></div>
  <div class="muted" data-t="preview.not_probability"></div>
  <div class="notice" id="followupNotice"></div>
  <div class="locked-grid">
   <div class="locked-card"><div class="lock">🔒 <span data-t="locked.breakdown"></span></div><div class="fake"></div><div class="fake short"></div></div>
   <div class="locked-card"><div class="lock">🔒 <span data-t="locked.scenarios"></span></div><div class="fake"></div><div class="fake short"></div></div>
   <div class="locked-card"><div class="lock">🔒 <span data-t="locked.consult"></span></div><div class="fake"></div><div class="fake short"></div></div>
  </div>
  <div class="actions"><button class="btn" id="openGate" data-t="preview.cta_report"></button></div>
  <p class="safety" data-t="safety.long"></p>
 </div>
</section>

<section class="screen gate" id="gate">
 <div class="card">
  <div class="eyebrow" data-t="gate.eyebrow"></div><h2 data-t="gate.title"></h2><p class="muted" data-t="gate.body"></p>
  <div class="field"><label for="email" data-t="gate.email_label"></label><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="nombre@ejemplo.com"></div>
  <label class="check"><input type="checkbox" id="consent"><span data-t="gate.consent"></span></label>
  <p class="privacy" data-t="gate.privacy"></p><div class="error" id="gateError" role="alert"></div>
  <div class="actions"><button class="linkbtn" id="gateBack" type="button" data-t="common.back"></button><button class="btn" id="submitEmail" type="button" data-t="gate.cta"></button></div>
 </div>
</section>

<section class="screen gate" id="success">
 <div class="card"><div class="eyebrow">✓</div><h2 data-t="success.title"></h2><p class="muted" data-t="success.body"></p><button class="btn" id="viewReport" data-t="success.cta"></button></div>
</section>

<section class="screen report" id="report">
 <div class="card">
  <div class="eyebrow">GlucoPredict · <span class="mono" id="verificationId">DEMO</span></div>
  <h2 data-t="report.title"></h2>
  <p id="reportSummary"></p>
  <div class="notice warn" data-t="report.noncausal"></div>
 </div>
 <div class="card section"><h3 data-t="report.breakdown"></h3><div class="bars" id="bars"></div></div>
 <div class="card section"><h3 data-t="report.scenarios"></h3><div class="scenarios" id="scenarios"></div></div>
 <div class="card section"><h3 data-t="report.method"></h3><p data-t="report.method_body"></p><p id="countryMethod"></p><p class="safety" data-t="safety.long"></p></div>
 <div class="actions"><button class="btn" id="restart" data-t="report.restart"></button></div>
</section>
</main>
<footer class="footer"><div class="wrap"><span>GlucoPredict · prototipo QA/UX etapa 3</span><span>Privacidad · Metodología · Fuentes · Aviso médico</span></div></footer>

  q:{age:["Qual é a sua idade?","Idade em anos completos."],sex:["Qual limiar de cintura corresponde ao seu sexo biológico?","Usado apenas para aplicar o limiar antropométrico publicado."],height:["Qual é a sua altura?","Informe centímetros. O motor usa unidades métricas."],weight:["Qual é o seu peso?","Informe quilogramas."],waist:["Quanto mede sua cintura?","Meça no meio entre a última costela e a crista ilíaca, sem apertar a fita."],activity:["Você faz pelo menos 30 minutos de atividade física por dia?","Inclua atividade cotidiana ou exercício."],fruit:["Você come frutas ou verduras todos os dias?","Responda conforme seu padrão habitual."],bp:["Você usa regularmente medicamento para pressão alta?","Somente medicamento indicado para pressão alta."],glucose:["Alguma vez disseram que sua glicose estava alta?","Por exemplo, em um exame, doença ou gravidez."],family:["Há diabetes na sua família?","Selecione o parentesco mais próximo aplicável."]},
  yes:"Sim",no:"Não",female:"Feminino",male:"Masculino",fam_none:"Não",fam_second:"Sim, parentes de segundo grau",fam_first:"Sim, pai/mãe, irmão/irmã ou filho/a",
  preview:{not_probability:"Esta faixa é uma referência histórica do modelo, não sua probabilidade pessoal.",cta_report:"Ver meu relatório completo",follow_yes:"Seu score atinge o limiar de acompanhamento usado neste perfil. Vale confirmar com um exame adequado e um profissional de saúde.",follow_no:"Seu score não atinge o limiar operacional deste perfil. Um score baixo não exclui diabetes ou pré-diabetes."},
  locked:{breakdown:"O que compõe seu score",scenarios:"Cenários da regra",consult:"Guia para consulta"},
  gate:{eyebrow:"Relatório ampliado",title:"Entenda o que compõe seu score e leve para a consulta",body:"Veja componentes, cenários matemáticos e metodologia. O score e a recomendação de segurança já são gratuitos.",email_label:"Email para receber o link",consent:"Aceito receber este relatório por email. Marketing exige consentimento separado.",privacy:"Não pedimos nome, data de nascimento nem endereço. Este protótipo não envia nem armazena este email.",cta:"Enviar meu relatório"},
  success:{title:"Seu relatório está pronto",body:"No produto você receberia um link privado. Neste protótipo, pode abrir o relatório diretamente.",cta:"Ver relatório"},
  report:{title:"Relatório do score",breakdown:"O que compõe o score",scenarios:"Cenários da regra",noncausal:"Simulação matemática do score; não prevê quanto seu risco real mudará.",method:"Metodologia e alcance",method_body:"FINDRISC/LA-FINDRISC parametrizado por país. O BMI é calculado em kg/m² e arredondado a 6 casas para aplicar cortes. Referências por faixa são históricas, não probabilidades pessoais.",restart:"Calcular novamente"},
  safety:{short:"Ferramenta educacional de triagem. Não diagnostica diabetes.",long:"GlucoPredict é uma ferramenta educacional de triagem. Não diagnostica diabetes nem substitui avaliação médica. Se você tiver sintomas, gravidez, diabetes conhecida ou preocupação clínica, procure orientação profissional mesmo com score baixo."},
  err:{required:"Este dado é necessário para calcular o score.",age:"Informe uma idade inteira entre 18 e 80.",height:"Informe uma altura entre 120 e 220 cm.",weight:"Informe um peso entre 35 e 250 kg.",waist:"Informe uma cintura entre 50 e 180 cm.",email:"Informe um email válido e aceite o envio do relatório."},
  band:{bajo:"Baixo",ligeramente_elevado:"Levemente elevado",moderado:"Moderado",alto:"Alto",muy_alto:"Muito alto"},
  labels:{age:"Idade",bmi:"BMI",waist:"Cintura",activity:"Atividade",diet:"Fruta/verdura",bp:"Pressão",glucose:"Glicose",family:"Família"}
 }
};
let lang="es", step=0, result=null;
const answers={age:55,sex:"female",height_cm:165,weight_kg:78,waist_cm:93,physical_activity_30m_daily:false,fruit_veg_daily:false,antihypertensive_medication:false,history_high_glucose:true,family_history:"first_degree"};
const questions=[
 {k:"age",type:"number",min:18,max:80,step:1,unit:""},
 {k:"sex",type:"choice",opts:[["female","female"],["male","male"]]},
 {k:"height",field:"height_cm",type:"number",min:120,max:220,step:.1,unit:"cm"},
 {k:"weight",field:"weight_kg",type:"number",min:35,max:250,step:.1,unit:"kg"},
 {k:"waist",field:"waist_cm",type:"number",min:50,max:180,step:.1,unit:"cm"},
 {k:"activity",field:"physical_activity_30m_daily",type:"choice",opts:[[true,"yes"],[false,"no"]]},
 {k:"fruit",field:"fruit_veg_daily",type:"choice",opts:[[true,"yes"],[false,"no"]]},
 {k:"bp",field:"antihypertensive_medication",type:"choice",opts:[[true,"yes"],[false,"no"]]},
 {k:"glucose",field:"history_high_glucose",type:"choice",opts:[[true,"yes"],[false,"no"]]},
 {k:"family",field:"family_history",type:"choice",opts:[["none","fam_none"],["second_degree","fam_second"],["first_degree","fam_first"]]}
];
function get(path){return path.split(".").reduce((o,k)=>o&&o[k],I[lang])}
function tr(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-t]").forEach(el=>{const v=get(el.dataset.t);if(v!=null)el.textContent=v});
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
 if(document.getElementById("wizard").classList.contains("active")) renderQ();
 if(result) renderResult();
}
function show(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
}
function renderQ(){
 const q=questions[step], field=q.field||q.k, form=document.getElementById("qForm"), val=answers[field];
 document.getElementById("progress").value=step+1;
 document.getElementById("progressText").textContent=(lang==="en"?"Step":lang==="pt"?"Etapa":"Paso")+" "+(step+1)+" "+(lang==="en"?"of":lang==="pt"?"de":"de")+" 10";
 document.getElementById("questionKey").textContent=q.k.toUpperCase();
 document.getElementById("qTitle").textContent=get("q."+q.k)[0];
 document.getElementById("qHelp").textContent=get("q."+q.k)[1]||"";
 document.getElementById("qError").classList.remove("show");
 document.getElementById("back").style.visibility=step===0?"hidden":"visible";
 if(q.type==="number"){
   form.innerHTML=`<div class="field"><label class="unitbox"><input id="qInput" type="number" inputmode="${q.step===1?"numeric":"decimal"}" min="${q.min}" max="${q.max}" step="${q.step}" value="${val??""}" aria-describedby="qHelp qError"><span class="unit">${q.unit}</span></label></div>`;
 }else{
   form.innerHTML='<div class="choices">'+q.opts.map((o,i)=>{
     const checked=(String(val)===String(o[0]))?"checked":"";
     return `<div class="choice"><input id="op${i}" name="choice" type="radio" value="${String(o[0])}" ${checked}><label for="op${i}"><span class="dot"></span><span>${get(o[1])}</span></label></div>`
   }).join("")+"</div>";
 }
}
function saveQ(){
 const q=questions[step], field=q.field||q.k, err=document.getElementById("qError");
 let value;
 if(q.type==="number"){
  const el=document.getElementById("qInput"); if(el.value===""){err.textContent=get("err.required");err.classList.add("show");return false}
  value=Number(el.value);
  const valid=Number.isFinite(value)&&value>=q.min&&value<=q.max&&(q.k!=="age"||Number.isInteger(value));
  if(!valid){err.textContent=get("err."+q.k)||get("err.required");err.classList.add("show");return false}
 } else {
  const el=document.querySelector('input[name="choice"]:checked');if(!el){err.textContent=get("err.required");err.classList.add("show");return false}
  value=el.value;
  if(["activity","fruit","bp","glucose"].includes(q.k)) value=value==="true";
 }
 answers[field]=value; return true;
}
const round6=x=>Math.round((x+Number.EPSILON)*1e6)/1e6;
function points(inputs,country="PE"){
 const raw=inputs.weight_kg/Math.pow(inputs.height_cm/100,2), bmi6=round6(raw);
 const variant=country==="ES"?"FINDRISC":"LA_FINDRISC";
 const age=inputs.age<45?0:inputs.age<=54?2:inputs.age<=64?3:4;
 const bmi=bmi6<25?0:bmi6<30?1:3;
 let waist=0;
 if(variant==="LA_FINDRISC"){waist=inputs.waist_cm<(inputs.sex==="female"?90:94)?0:4}
 else if(inputs.sex==="female"){waist=inputs.waist_cm<80?0:inputs.waist_cm<88?3:4}
 else{waist=inputs.waist_cm<94?0:inputs.waist_cm<102?3:4}
 const c={age,bmi,waist,activity:inputs.physical_activity_30m_daily?0:2,diet:inputs.fruit_veg_daily?0:1,bp:inputs.antihypertensive_medication?2:0,glucose:inputs.history_high_glucose?5:0,family:inputs.family_history==="none"?0:inputs.family_history==="second_degree"?3:5};
 const score=Object.values(c).reduce((a,b)=>a+b,0);
 const band=score<=6?"bajo":score<=11?"ligeramente_elevado":score<=14?"moderado":score<=20?"alto":"muy_alto";
 const threshold=country==="PE"?11:12, status=country==="PE"?"verificado":"preliminar";
 const scenarios=[];
 if(!inputs.physical_activity_30m_daily) scenarios.push(["Actividad diaria ≥30 min",score-c.activity]);
 if(!inputs.fruit_veg_daily) scenarios.push(["Fruta/verdura diaria",score-c.diet]);
 const waistTarget=variant==="LA_FINDRISC"?(inputs.sex==="female"?89.99:93.99):(inputs.sex==="female"?(inputs.waist_cm>=88?87.99:79.99):(inputs.waist_cm>=102?101.99:93.99));
 if(c.waist>0) {
  let newWp=0;if(variant==="FINDRISC"){newWp=inputs.sex==="female"?(waistTarget<80?0:waistTarget<88?3:4):(waistTarget<94?0:waistTarget<102?3:4)}
  scenarios.push(["Cintura al corte inferior de la regla",score-c.waist+newWp]);
 }
 if(bmi6>=30) scenarios.push(["BMI 29.99 en la regla",score-c.bmi+1]);
 else if(bmi6>=25) scenarios.push(["BMI 24.99 en la regla",score-c.bmi]);
 return {raw_bmi:raw,bmi6,display_bmi:Math.round(raw*100)/100,components:c,score,band,threshold,status,followup:score>=threshold,variant,scenarios,country};
}
function calculate(){
 show("processing");
 setTimeout(()=>{result=points(answers,"PE");renderResult();show("preview")},420);
}
function renderResult(){
 if(!result)return;
 document.getElementById("scoreVal").textContent=result.score;
 document.getElementById("bandVal").textContent=get("band."+result.band);
 document.getElementById("previewTitle").textContent=(lang==="en"?"Your score is ":lang==="pt"?"Seu score é ":"Tu score es ")+result.score+(lang==="en"?" out of 26":" de 26");
 document.getElementById("followupText").textContent=result.followup?get("preview.follow_yes"):get("preview.follow_no");
 document.getElementById("evidenceTag").textContent=(lang==="en"?"Country threshold: ":lang==="pt"?"Limiar do país: ":"Umbral país: ")+result.threshold+" · "+result.status.toUpperCase()+" · PE";
 document.getElementById("marker").style.left=(result.score/26*100)+"%";
 const n=document.getElementById("followupNotice");n.className="notice "+(result.followup?"warn":"ok");n.textContent=result.followup?get("preview.follow_yes"):get("preview.follow_no");
 renderReport();
}
function renderReport(){
 if(!result)return;
 document.getElementById("reportSummary").textContent=(lang==="en"?`Score ${result.score}/26 · ${get("band."+result.band)} · BMI ${result.display_bmi}.`:
 lang==="pt"?`Score ${result.score}/26 · ${get("band."+result.band)} · BMI ${result.display_bmi}.`:`Score ${result.score}/26 · ${get("band."+result.band)} · BMI ${result.display_bmi}.`);
 document.getElementById("verificationId").textContent="DEMO-M2-"+String(result.score).padStart(2,"0")+"-PE";
 const order=["age","bmi","waist","activity","diet","bp","glucose","family"];
 document.getElementById("bars").innerHTML=order.map(k=>`<div class="barrow"><span>${get("labels."+k)}</span><div class="track"><div class="fill" style="width:${result.components[k]/5*100}%"></div></div><strong>${result.components[k]}</strong></div>`).join("");
 document.getElementById("scenarios").innerHTML=(result.scenarios.length?result.scenarios:[["—",result.score]]).map(s=>`<div class="scenario"><span>${s[0]}</span><strong>${result.score} → ${s[1]}</strong></div>`).join("");
 document.getElementById("countryMethod").textContent=(lang==="en"?"PE follow-up threshold ≥11 is verified in a 2024 external validation with 549 hospital workers; it is not national calibration.":
 lang==="pt"?"O limiar de acompanhamento PE ≥11 foi verificado em validação externa de 2024 com 549 trabalhadores hospitalares; não é calibração nacional.":
 "El umbral PE ≥11 está verificado en una validación externa de 2024 con 549 trabajadores hospitalarios; no es calibración nacional.");
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;tr()});
document.getElementById("start").onclick=()=>{step=0;renderQ();show("wizard")};
document.getElementById("next").onclick=()=>{if(!saveQ())return;if(step<9){step++;renderQ()}else calculate()};
document.getElementById("back").onclick=()=>{if(step>0){step--;renderQ()}};
document.getElementById("openGate").onclick=()=>show("gate");
document.getElementById("gateBack").onclick=()=>show("preview");
document.getElementById("submitEmail").onclick=()=>{
 const email=document.getElementById("email").value.trim(),ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)&&document.getElementById("consent").checked,e=document.getElementById("gateError");
 if(!ok){e.textContent=get("err.email");e.classList.add("show");return}e.classList.remove("show");show("success")
};
document.getElementById("viewReport").onclick=()=>show("report");
document.getElementById("restart").onclick=()=>{step=0;result=null;show("landing")};
tr();
</script>
</body>
</html>
